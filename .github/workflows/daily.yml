name: Daily Script Generator

on:
  schedule:
    # 19:00 Nepal Time (NPT, UTC+5:45) daily
    - cron: "15 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r generator/requirements.txt

      - name: Generate today's script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generator/generate_script.py

      - name: Commit and push
        run: |
          git config user.name "charitra shrestha"
          git config user.email "stharabi9862187405@gmail.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: add daily generated script ($(date -u +%Y-%m-%d))"
          git push
